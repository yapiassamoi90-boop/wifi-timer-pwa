<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accès Wi-Fi Temporaire</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    h2 {
      color: #1a1a1a;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
    .qr-container {
      position: relative;
      background: #fafafa;
      border: 2px dashed #ddd;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      min-height: 250px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .qr-container img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }
    .expired-box {
      display: none;
      color: #e74c3c;
      font-weight: bold;
    }
    .timer-display {
      font-size: 1.5rem;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 20px;
      background: #eef2f7;
      padding: 10px;
      border-radius: 8px;
    }
    .btn {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>AU SERVICE DE TOUS</h2>
  <p class="subtitle">Accès réseau temporaire (30 min)</p>

  <div class="timer-display" id="timer">30:00</div>

  <div class="qr-container">
    <!-- Nom de fichier mis à jour ici -->
    <img id="qrImage" src="Screenshot_20260820_113444_113454.jpg" alt="QR Code Wi-Fi">
    <div id="expiredMsg" class="expired-box">
      <p>⚠️ Accès expiré !</p>
      <p style="font-size: 0.85rem; font-weight: normal; margin-top: 5px; color: #555;">
        Le délai de 30 minutes est écoulé.
      </p>
    </div>
  </div>

  <button class="btn" onclick="startNewSession()">Générer / Recharger (30 min)</button>
</div>

<script>
  const DURATION_MINUTES = 30;
  let countdown;

  function startTimer(durationInSeconds) {
    clearInterval(countdown);
    let timer = durationInSeconds;

    const timerDisplay = document.getElementById('timer');
    const qrImage = document.getElementById('qrImage');
    const expiredMsg = document.getElementById('expiredMsg');

    qrImage.style.display = "block";
    expiredMsg.style.display = "none";

    countdown = setInterval(() => {
      const minutes = parseInt(timer / 60, 10);
      const seconds = parseInt(timer % 60, 10);

      const displayMinutes = minutes < 10 ? "0" + minutes : minutes;
      const displaySeconds = seconds < 10 ? "0" + seconds : seconds;

      timerDisplay.textContent = `${displayMinutes}:${displaySeconds}`;

      if (--timer < 0) {
        clearInterval(countdown);
        timerDisplay.textContent = "00:00";
        qrImage.style.display = "none";
        expiredMsg.style.display = "block";
        localStorage.removeItem('wifi_expiration');
      }
    }, 1000);
  }

  function startNewSession() {
    const expirationTime = Date.now() + (DURATION_MINUTES * 60 * 1000);
    localStorage.setItem('wifi_expiration', expirationTime);
    startTimer(DURATION_MINUTES * 60);
  }

  window.onload = function () {
    const savedExpiration = localStorage.getItem('wifi_expiration');
    
    if (savedExpiration) {
      const remainingTime = Math.floor((savedExpiration - Date.now()) / 1000);
      if (remainingTime > 0) {
        startTimer(remainingTime);
      } else {
        document.getElementById('timer').textContent = "00:00";
        document.getElementById('qrImage').style.display = "none";
        document.getElementById('expiredMsg').style.display = "block";
      }
    } else {
      startTimer(DURATION_MINUTES * 60); // Affiche le temps au chargement initial
    }
  };
</script>

</body>
</html>
